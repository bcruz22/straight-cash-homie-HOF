name: Weekly refresh
# Tuesdays at 21:36 UTC (4:36 PM Eastern in winter, 5:36 PM in early fall), September through January.
on:
  schedule:
    - cron: '36 21 * 9-12,1 2'
  workflow_dispatch: {}
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pull Sleeper data and rebuild
        run: |
          bash scripts/refresh.sh "$GITHUB_WORKSPACE"
          cp out/*.json docs/data/
      - name: Commit updated data
        run: |
          git config user.name "hof-refresh"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "Weekly data refresh"
          git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
